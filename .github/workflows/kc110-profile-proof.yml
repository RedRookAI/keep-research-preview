name: KC110 same-guest package-profile proof
on:
  push:
    branches: [work/kc110-profile-proof-2026-11-12]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Run approved disposable Debian x64 fixture
        shell: bash
        run: bash .github/kc110/fixture.sh
