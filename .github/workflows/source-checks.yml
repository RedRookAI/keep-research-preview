name: Independent source build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f4fd9e35f7655c646998c0618fa37639e10a24a1
          persist-credentials: false
      - name: Select declared Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Build with fresh public dependencies and locked compiler
        shell: bash
        run: |
          set -euo pipefail
          KEEP_SOURCE_ROOT=$(mktemp -d "$HOME/keep-source-build-XXXXXXXX")
          mkdir "$KEEP_SOURCE_ROOT/home" "$KEEP_SOURCE_ROOT/tmp"
          env -i PATH="$PATH" HOME="$KEEP_SOURCE_ROOT/home" RUSTUP_HOME="$KEEP_SOURCE_ROOT/rustup" CARGO_HOME="$KEEP_SOURCE_ROOT/cargo" LANG=C.UTF-8 rustup toolchain install 1.97.1 --profile minimal --component rustfmt --target x86_64-unknown-linux-musl
          env -i PATH="$PATH" HOME="$KEEP_SOURCE_ROOT/home" TMPDIR="$KEEP_SOURCE_ROOT/tmp" RUSTUP_HOME="$KEEP_SOURCE_ROOT/rustup" CARGO_HOME="$KEEP_SOURCE_ROOT/cargo" KEEP_P1_TOOLCHAIN_ROOT="$KEEP_SOURCE_ROOT/rustup/toolchains/1.97.1-x86_64-unknown-linux-gnu" NPM_CONFIG_CACHE="$KEEP_SOURCE_ROOT/npm-cache" LANG=C.UTF-8 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/bash --noprofile --norc -eu -o pipefail <<'BUILD'
          test "$(git rev-parse HEAD)" = f4fd9e35f7655c646998c0618fa37639e10a24a1
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg=JSON.parse(readFileSync('package.json'));
          const transport=JSON.parse(readFileSync('dist/native/linux-x64/manifest.json'));
          const capture=JSON.parse(readFileSync('dist/native/linux-x64/capture-manifest.json'));
          const api=await import('./dist/src/index.js');
          assert.equal(typeof api.publishPackagedNativePatchApplicationV1,'function');
          console.log(JSON.stringify({schema:'keep.independent-source-build/v1',status:'PASS',source:'f4fd9e35f7655c646998c0618fa37639e10a24a1',version:pkg.version,node:process.version,arch:process.arch,standardBuildCommand:'npm run build',freshDependencies:true,freshLockedToolchain:true,publicImport:true,artifacts:[...transport.artifacts,...capture.artifacts]}));
          JS
          BUILD
