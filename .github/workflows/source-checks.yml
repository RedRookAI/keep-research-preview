name: Independent published release
run-name: Independent .21 download — ${{ inputs.phase }}

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Verification slice
        type: choice
        options: [baseline, preparation, engine]
        default: baseline

permissions: {}

jobs:
  installed:
    name: Fresh x64 public-download consumer
    runs-on: ubuntu-24.04
    steps:
      - name: Select declared Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          package-manager-cache: false
      - name: Create independent workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(id -u)" != 0
          test ! -e "$GITHUB_WORKSPACE/package.json"
          KEEP_VERIFY_ROOT=$(mktemp -d "$HOME/keep-independent-XXXXXXXX")
          mkdir "$KEEP_VERIFY_ROOT/bootstrap-home"
          echo "KEEP_VERIFY_ROOT=$KEEP_VERIFY_ROOT" >> "$GITHUB_ENV"
          printf 'No source checkout, dependency cache, maintainer home or credentials supplied.\n'
      - name: Download pinned public release inputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$KEEP_VERIFY_ROOT"
          base=https://github.com/RedRookAI/keep-research-preview/releases/download/keep-preview-2026-11-11.2
          for asset in keep-combined-0.0.21-preview.1-linux-x64.tar.gz installed-preview-2026-11-11.2.mjs native-publisher-check-2026-11-11.mjs native-publisher-fixture-2026-11-11.json; do
            curl --fail --location --silent --show-error --proto '=https' "$base/$asset" --output "$asset"
          done
          cat > expected.sha256 <<'SUMS'
          7b22762a48a0f6e1e26db342b51ef211035db0cf1b88619a720324b3ef5f3fca  keep-combined-0.0.21-preview.1-linux-x64.tar.gz
          dc93efe0fb023e5251010a13371f9731ab2e27b3e5e5fc4dad1b164f1ea55952  installed-preview-2026-11-11.2.mjs
          39a6ad011a49beaba3d5b1c1bea5ec4a170713f7a9c96c655e878194880e5e2d  native-publisher-check-2026-11-11.mjs
          2f7826b74c48fa3046860080350be6ab96acd3e0b0c444b8940bf36fd599893d  native-publisher-fixture-2026-11-11.json
          SUMS
          sha256sum --check expected.sha256
      - name: Run published unprivileged consumer without developer configuration
        if: inputs.phase == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          cd "$KEEP_VERIFY_ROOT"
          node_path=$(command -v node)
          env -i PATH="$PATH" HOME="$KEEP_VERIFY_ROOT/bootstrap-home" "$node_path" installed-preview-2026-11-11.2.mjs "$KEEP_VERIFY_ROOT/keep-combined-0.0.21-preview.1-linux-x64.tar.gz" 7b22762a48a0f6e1e26db342b51ef211035db0cf1b88619a720324b3ef5f3fca
      - name: Run published native SDK consumer on the same extraction
        if: inputs.phase == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          cd "$KEEP_VERIFY_ROOT"
          node_path=$(command -v node)
          env -i PATH="$PATH" HOME="$KEEP_VERIFY_ROOT/bootstrap-home" "$node_path" native-publisher-check-2026-11-11.mjs "$KEEP_VERIFY_ROOT/fresh owner/keep-0.0.21-preview.1" "$KEEP_VERIFY_ROOT/keep-combined-0.0.21-preview.1-linux-x64.tar.gz" 7b22762a48a0f6e1e26db342b51ef211035db0cf1b88619a720324b3ef5f3fca "$KEEP_VERIFY_ROOT/native-publisher-fixture-2026-11-11.json" "$KEEP_VERIFY_ROOT"
      - name: Check bundled engine with an empty account home
        if: inputs.phase == 'engine'
        shell: bash
        run: |
          set -euo pipefail
          cd "$KEEP_VERIFY_ROOT"
          mkdir engine-check
          tar -xzf keep-combined-0.0.21-preview.1-linux-x64.tar.gz -C engine-check keep-0.0.21-preview.1/engines
          node_path=$(command -v node)
          env -i PATH="$PATH" HOME="$KEEP_VERIFY_ROOT/bootstrap-home" "$node_path" --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {resolve} from 'node:path';
          const engine=resolve('engine-check/keep-0.0.21-preview.1/engines/codex-generation.2/bin/codex');
          const version=spawnSync(engine,['--version'],{encoding:'utf8',env:process.env});
          assert.equal(version.status,0,version.stderr);
          assert.match(version.stdout,/0\.163\.0-keep-generation\.2/);
          const login=spawnSync(engine,['login','status'],{encoding:'utf8',env:process.env});
          assert.notEqual(login.status,0);
          assert.match(login.stdout+login.stderr,/not logged in/i);
          console.log(JSON.stringify({schema:'keep.independent-engine-metadata/v1',status:'PASS',version:version.stdout.trim(),freshHomeLoggedOut:true,modelCalls:0}));
          JS
      - name: Build declared namespace prerequisite from public source
        if: inputs.phase == 'preparation'
        shell: bash
        run: |
          set -euo pipefail
          cd "$KEEP_VERIFY_ROOT"
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/RedRookAI/keep-research-preview/83a67b04fa03e6fd1a1564b6b93cc1c3f19deb24/tools/bubblewrap/Dockerfile" --output Dockerfile
          printf '%s\n' 'a317b76c36d96871effb743645147046c8f2dd00d9fa7eac29ea4f8cc994306f  Dockerfile' | sha256sum --check
          if ! docker build --tag keep-independent-helper --file Dockerfile . > helper-build.log 2>&1; then tail -80 helper-build.log; exit 1; fi
          helper_container=$(docker create keep-independent-helper)
          trap 'docker rm "$helper_container" >/dev/null' EXIT
          docker cp "$helper_container:/opt/keep/bubblewrap/0.13.0/bwrap" bwrap
          docker cp "$helper_container:/build/build-packages.txt" build-packages.txt
          sha256sum bwrap
          printf '%s\n' 'e96e817b17de74e75f9680755a700f16c9f59917a264c499175da704651bd41f  bwrap' | sha256sum --check
          stat -c '%a %u:%g %n' / /opt /var /var/lib
          sudo install -d -m 0755 "/var/lib/keep-independent-$GITHUB_RUN_ID"
          sudo install -m 0755 bwrap "/var/lib/keep-independent-$GITHUB_RUN_ID/bwrap"
      - name: Verify offline preparation using only public package inputs
        if: inputs.phase == 'preparation'
        shell: bash
        run: |
          set -euo pipefail
          cd "$KEEP_VERIFY_ROOT"
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/RedRookAI/keep-research-preview/$GITHUB_SHA/docs/qualification/independent-preparation.mjs" --output independent-preparation.mjs
          printf '%s\n' '8015b6dbde3c72a4d3ab8c8ed12cfd07b5a36fc4dcecb33974e3ad7843240d69  independent-preparation.mjs' | sha256sum --check
          mkdir installed
          tar -xzf keep-combined-0.0.21-preview.1-linux-x64.tar.gz -C installed
          stat -c '%a %u:%g %n' /home /home/runner "$KEEP_VERIFY_ROOT"
          for policy in /proc/sys/kernel/apparmor_restrict_unprivileged_userns /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces; do
            if test -r "$policy"; then printf '%s=' "$policy"; cat "$policy"; fi
          done
          stat -c '%a %u:%g %n' /var/lib "/var/lib/keep-independent-$GITHUB_RUN_ID" "/var/lib/keep-independent-$GITHUB_RUN_ID/bwrap"
          node_path=$(command -v node)
          "$node_path" --input-type=module <<'JS'
          import {pathToFileURL} from 'node:url';
          import {resolve} from 'node:path';
          const api=await import(pathToFileURL(resolve('installed/keep-0.0.21-preview.1/dist/src/infra/required_project_jail.js')));
          try{api.inspectRequiredJailLauncher('/var/lib/keep-independent-'+process.env.GITHUB_RUN_ID+'/bwrap');console.log('Packaged helper admission PASS');}
          catch(error){console.error('Packaged helper admission: '+error.message);throw error;}
          JS
          node_root=$("$node_path" -p 'require("node:path").dirname(require("node:path").dirname(process.execPath))')
          env -i PATH="$PATH" HOME="$KEEP_VERIFY_ROOT/bootstrap-home" "$node_path" independent-preparation.mjs "$KEEP_VERIFY_ROOT/installed/keep-0.0.21-preview.1" "$node_root" "/var/lib/keep-independent-$GITHUB_RUN_ID/bwrap" "$KEEP_VERIFY_ROOT/preparation"
