[workspace]
resolver = "3"
members = ["crates/protocol", "crates/transport", "crates/p2-d2-evidence", "crates/linux-abi", "crates/p2-d2-supervisor", "crates/production-resolver", "crates/prober-launcher", "crates/prober-vmm-shim"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["fs", "poll", "socket", "uio", "user"] }
rustix = { version = "=1.1.4", default-features = false, features = ["net", "std"] }
libc = "=0.2.189"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "fat"
strip = "none"
